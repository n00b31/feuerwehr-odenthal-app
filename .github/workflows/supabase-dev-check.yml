name: Validate Supabase DEV migrations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/supabase-dev, feature/supabase-auth-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ff_dev_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d ff_dev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check protected recovery Edge Function
        run: deno check supabase/functions/password-recovery/index.ts
      - name: Create isolated Auth test fixture
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/auth-fixture.sql
      - name: Apply versioned migrations to disposable PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Validating $migration"
            docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Verify idempotent fire-station reference data migration
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/migrations/20261108002000_firestations.sql
      - name: Verify RLS and server-side authorization
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/authorization.sql
      - name: Verify single events and shared participation
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/events.sql
      - name: Verify scoped member management and last administrator protection
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/members.sql
      - name: Verify server-only DEV seed and seeded role boundaries
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/dev-seed.sql
      - name: Verify attendance state, final-only RLS and delegated organizers
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/attendance.sql
      - name: Verify bounded event lists, Berlin month pagination and preserved scopes
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/event-list.sql
      - name: Verify final-only dutybooks, historical scopes and read-only FIRE_CHIEF reporting
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/reports.sql
      - name: Verify isolated non-login historical seed, corrected units and protected originals
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/history-seed.sql
      - name: Verify shared calendar, resource conflicts, scoped visibility and unchanged dutybooks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/calendar.sql
      - name: Verify scoped vehicle workflows, notifications, audit and idempotent DEV fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/vehicles.sql
      - name: Verify recovery roles, shared atomic reservations and immutable audit
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/password-recovery.sql
      - name: Verify dynamic memberships, fixed invitations and immutable attendance snapshots
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d ff_dev_ci -v ON_ERROR_STOP=1 < supabase/tests/dynamic-memberships.sql
      - name: Verify real parallel recovery limits and one-time PKCE claims
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash supabase/tests/recovery-concurrency.sh
      - name: Verify overlapping attendance initialization with two connections
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash supabase/tests/attendance-concurrency.sh
      - name: Verify two simultaneous vehicle approvers cannot double-book
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash supabase/tests/vehicle-concurrency.sh

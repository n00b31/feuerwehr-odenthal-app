name: Publish demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_DEV_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_DEV_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check:supabase-config
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run icons
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Verify static deployment under repository path
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: |
          node scripts/preview-pages.mjs > /tmp/feuerwehr-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:3100${NEXT_PUBLIC_BASE_PATH}/" > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: |
            out
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
